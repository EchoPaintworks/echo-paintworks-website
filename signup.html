<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Echo Paintworks</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="js/supabase.min.js"></script>
<script src="js/config.js"></script>
</head>
<body>

<header class="site-header">
  <div class="nav-row">
    <a class="brand" href="index.html">
      <img src="assets/icon_black.png" alt="">
      <span class="brand-word">Echo <span class="thin">Paintworks</span></span>
    </a>
    <nav class="links">
      <a href="index.html">Home</a>
      <a href="account.html" class="active">Account</a>
      <a href="quote.html">Get a Quote</a>
      <a href="services.html">Services</a>
      <a href="past-work.html">Past Work</a>
      <a href="about.html">About</a>
    </nav>
    <button class="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</header>

<section style="padding:64px 0;">
  <div class="wrap" style="max-width:520px;">
    <div class="eyebrow-line"><span class="rule"></span> Create Account</div>
    <h1 style="font-size:2rem; margin-bottom:28px;">Set up your account</h1>

    <form id="signupForm" class="quote-form" style="grid-template-columns:1fr;">
      <div>
        <label for="full_name">Full name</label>
        <input type="text" id="full_name" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div>
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" required>
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" minlength="6" required>
      </div>
      <div>
        <label style="display:flex; gap:10px; align-items:flex-start; font-size:0.9rem; color:var(--stone);">
          <input type="checkbox" id="smsConsent" style="width:auto; margin-top:3px;">
          <span>I agree to receive account and project update messages by email and text from Echo Paintworks. Message and data rates may apply. Reply STOP to opt out of texts at any time. See our <a href="privacy.html" target="_blank">Privacy Policy</a> and <a href="terms.html" target="_blank">Terms</a>.</span>
        </label>
      </div>
      <div>
        <button type="submit" class="btn btn-fill" id="submitBtn">Create account</button>
        <p class="form-note" id="formMsg"></p>
      </div>
    </form>

    <p style="margin-top:20px; font-size:0.95rem; color:var(--stone);">Already have an account? <a href="login.html" id="loginLink" style="color:var(--lake); text-decoration:underline;">Log in</a></p>
  </div>
</section>

<script>
const supa = supabase.createClient(window.ECHO_CONFIG.SUPABASE_URL, window.ECHO_CONFIG.SUPABASE_ANON_KEY);

// Carry a ?next= param through to the login link, if present
(function() {
  const next = new URLSearchParams(window.location.search).get('next');
  if (next) document.getElementById('loginLink').href = 'login.html?next=' + encodeURIComponent(next);
})();

document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('formMsg');
  const btn = document.getElementById('submitBtn');

  if (!document.getElementById('smsConsent').checked) {
    msg.textContent = "Please check the box agreeing to receive account updates.";
    return;
  }

  const full_name = document.getElementById('full_name').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;

  btn.disabled = true;
  msg.textContent = "Creating your account...";

  const { data, error } = await supa.auth.signUp({
    email, password,
    options: { data: { full_name, phone } }
  });

  if (error) {
    msg.textContent = error.message;
    btn.disabled = false;
    return;
  }

  // Fire the welcome email/SMS + notify-admin function.
  // This is "fire and forget" — a hiccup here shouldn't block signup.
  fetch('/api/signup-notify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ full_name, email, phone })
  }).catch(() => {});

  const params = new URLSearchParams(window.location.search);
  const next = params.get('next');
  const destination = (next && next.endsWith('.html')) ? next : 'dashboard.html';

  // Try to sign them straight in (works once "Confirm email" is off in Supabase Auth settings).
  const { error: signInErr } = await supa.auth.signInWithPassword({ email, password });
  if (!signInErr) {
    window.location.href = destination;
  } else {
    msg.textContent = "Account created! Check your email to confirm, then log in.";
    btn.disabled = false;
  }
});
</script>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom">
      <span>© <span id="year"></span> Echo Paintworks. All rights reserved.</span>
      <span>A Fresher Perspective.</span>
    </div>
  </div>
</footer>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
<script src="script.js"></script>
</body>
</html>
